name: Run Simulation Tests and Publish Report

on:
  push:
    branches:
      - main
    paths:
      - 'spatio_flux/**'
      - '.github/workflows/run-tests-and-publish-report.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - monod_kinetics
          - ecoli_core_dfba
          - ecoli_dfba
          - yeast_dfba
          - community_dfba
          - dfba_kinetics_community
          - spatial_many_dfba
          - spatial_dfba_process
          - diffusion_process
          - brownian_particles
          - br_particles_kinetics
          - br_particles_dfba
          - comets_diffusion
          - comets_br_particles_kinetics
          - comets_br_particles_dfba
          - newtonian_particles
          - comets_nt_particles_dfba
          - spatioflux_reference_demo
          - reference_demo_x2y2
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install system dependencies (Graphviz)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies with uv
        run: uv sync --frozen

      - name: Run test
        run: |
          mkdir -p out
          uv run python spatio_flux/experiments/test_suite.py --tests ${{ matrix.test }} --output out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.test }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: run-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for gh-pages access

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install system dependencies (Graphviz)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies with uv
        run: uv sync --frozen

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: out

      - name: Compile HTML report
        run: |
          uv run python spatio_flux/experiments/test_suite.py --skip-existing --output out

      - name: Commit and push report to gh-pages
        run: |
          git config --local user.email "eagmon@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin

          mv out/report.html out/index.html

          git checkout gh-pages || git checkout --orphan gh-pages
          git pull origin gh-pages || true

          rm -rf report
          mkdir -p report
          cp -r out/* report/

          git add report/
          git diff-index --quiet HEAD || git commit -m "Update simulation test report"
          git push origin gh-pages || true
