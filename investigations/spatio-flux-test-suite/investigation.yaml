schema_version: 2
name: spatio-flux-test-suite
title: "Spatio-Flux Test Suite — compositional multiscale scenarios"
created: '2026-07-26'
status: running
executive:
  what_is_this: |-
    The spatio-flux reference application as one investigation, now in two layers: (1) 19 reproduction studies that faithfully re-run every scenario of the original test suite (standalone processes -> pairs -> triples -> reference demos) as a hardened, quantitatively code-evaluated baseline; and (2) 7 biology-forward discovery-engine studies that extend those composites into new emergent biology — spatial growth fronts, overflow/cross-feeding substrate accumulation, spatial-vs-well-mixed substrate use, carbon-limited yield, a nutrient-starvation negative control, and division/advection phase diagrams.
  verdict: >-
    SpatioFlux resolves emergent spatial biology its well-mixed constituents cannot: a biomass front propagates and spreads across the diffusing field; overflow metabolism secretes and accumulates acetate (the cross-feeding substrate pool); spatial structure leaves substrate unconsumed that a well-mixed community fully depletes; dynamic-FBA yield scales ~4x with carbon supply; and population size and plume reach vary monotonically with the division threshold (multiseed) and advection strength. A zero-carbon adversarial control correctly shows no growth, establishing these signals as carbon-driven biology rather than artifacts. Underneath, all 19 original composition scenarios still pass their regression tests — the reproduction baseline the new biology is built on.
  verdict_status: established
  decisions_needed: []
scientific_argument:
  main_claim: >-
    Independently developed processes (dFBA, Monod kinetics, diffusion-advection, Brownian and Newtonian particles) compose through typed shared state into quantitatively measurable EMERGENT SPATIAL BIOLOGY: growth fronts, spatial cross-feeding substrate pools, transport-controlled spread, and carbon-limited yield — each asserted by a code-evaluated contract on a real run, not by artifact existence alone.
  support: >
    The DAG (standalone → pairs → triples → reference demos) is documentation of
    composition order, not an execution gate — every study runs independently and
    its output is checked against the out0 oracle, so a passing combination is
    evidence the constituent processes compose without hidden coupling.
  evidence_for:
  - 'spatial_growth_front: a seeded biomass front advances (front position 0->8), its centroid migrates downstream, and its spread grows — emergent spatial pattern.'
  - 'spatial_overflow_crossfeeding: acetate accumulates as an overflow byproduct while glucose is consumed — the measured precondition for spatial cross-feeding.'
  - 'spatial_vs_wellmixed_community: a well-mixed community depletes glucose to ~0 while the spatial arrangement leaves a large glucose pool unconsumed — spatial structure governs substrate use.'
  - 'glucose_limitation_yield: final biomass scales ~4x between 2 and 10 mM glucose — the quantitative carbon-limitation response.'
  - 'division_seeding_regimes / advection_plume_phase: population size falls monotonically with the division threshold (multiseed) and plume reach rises monotonically with advection — tunable phase relationships.'
  - '19 reproduction studies: every original composition scenario passes its regression + new quantitative growth/depletion/mass-conservation/MSD contracts.'
  evidence_against:
  - 'Particle studies are stochastic: single-seed sweeps are noisy (division_seeding_regimes is monotone only on a 3-seed average).'
  - Acetate re-uptake (true cross-feeding peak-then-decline) is not yet observed — glucose is far from exhausted on the large lattice at these horizons.
  - Lattices are coarse and horizons short; the dFBA models are reduced/core.
  caveats:
  - Claims are evaluated at the simulated horizons and resolutions; longer runs / finer lattices / more seeds would tighten several of them (captured as discovery_implications follow-ups).
  key_figures:
  - studies/spatial_growth_front/charts/spatial_growth_front_trajectory.png
  - studies/division_seeding_regimes/charts/division_seeding_regimes_phase.png
  - studies/advection_plume_phase/charts/advection_plume_phase_phase.png
biological_story: |
  Metabolism, spatial transport, and particle dynamics coupled on a shared
  lattice reproduce COMETS-style spatial dFBA and particle–field exchange: cells
  consume and secrete metabolites into diffusing extracellular fields, and
  particle populations advect and react on the same grid.
