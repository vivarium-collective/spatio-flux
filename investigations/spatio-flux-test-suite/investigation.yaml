competing_frameworks:
- name: Well-mixed ODE / batch metabolism
  relation: SpatioFlux resolves the spatial structure these omit — spatial_vs_wellmixed_community shows the spatial arrangement leaves substrate unconsumed that a well-mixed model fully depletes.
- name: Field-only COMETS spatial dFBA
  relation: complementary and reproduced here (comets_* studies); SpatioFlux additionally couples particle-based (agent) biomass to the fields.
- name: Particle-based vs field-based biomass
  relation: both are expressed in the composites; the particle (br_/comets_br_/reference) and field (comets_diffusion/spatial_*) studies compare the two representations of the same growth.
