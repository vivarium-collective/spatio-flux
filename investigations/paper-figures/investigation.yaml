schema_version: 2
name: paper-figures
title: Process Bigraph paper — figures
created: '2026-08-09'
status: running
executive:
  what_is_this: >
    One study per figure of the Process Bigraph paper. Each study describes the
    figure and checks that its bigraph-loom image is generated (shown under
    Visualizations as an SVG). Fig 2 is conceptual (no composite); Figs 7.1–7.3
    and Fig 8 are the runnable spatio-flux composites; some paper figures (e.g.
    Figs 5–6) live elsewhere and are not built here.
  verdict: >
    All eight figure studies generate their committed SVG/PNG artifacts; the
    runnable composites (Figs 7–8) additionally reproduce their simulation output.
    The paper's figures are regenerable from the framework via
    `scripts/build_all_figures.py`.
  verdict_status: established
  decisions_needed: []
# Methods/figures investigation — biology is not the subject, so the biological
# narrative section is explicitly opted out (linter contract).
narrative_spine_skip: [biological_story]
narrative_spine_skip_reason: >
  paper-figures documents and regenerates the Process Bigraph paper's figures;
  it is a methods/presentation investigation with no biological claim of its own.
scientific_argument:
  main_claim: >
    The Process Bigraph paper's figures are not hand-drawn — each is generated
    from a real framework artifact (a bigraph-loom schematic, or, for Figs 7–8, a
    runnable spatio-flux composite with its simulation output), so the paper's
    visual claims are reproducible from the codebase.
  support: >
    Diagram figures render their committed bigraph-loom SVGs; the runnable-composite
    figures (7–8) reuse the spatio-flux-test-suite composites and their out0-checked
    output, so the figures and the reference application share one source of truth.
studies:
- fig-01
- fig-02
- fig-03
- fig-04
- fig-05
- fig-06
- fig-07
- fig-08
# Captions + numbering for the stitched figures (the ↓ figures download + the
# Figures surfaces). Optional overrides on top of the auto-discovered composites;
# `caption` describes what each figure shows.
figures:
- study: fig-01
  number: 1
  caption: >-
    Composition, three ways. 1a: the draft-process building blocks — gene expression,
    metabolism, a morphogen gradient, and multicellular interactions. 1b: their
    multiscale composite, wired into a nested place graph from molecular to
    multicellular scales. 1c: a study workflow — a draft preprocess step feeding three
    parallel community-dFBA simulations (real, zoomable composites) and a draft
    analysis + visualization step.
- study: fig-02
  number: 2
  caption: >-
    One abstract bigraph, two readings. 2a: the Milner form, with each process collapsed
    to a hyperedge point-vertex over the stores it touches. 2b: the process bigraph, with
    processes p1–p3 linking place-graph nodes n1–n6 through typed input/output ports.
- study: fig-03
  number: 3
  caption: >-
    A process graph and the composite process it defines — the same wiring seen as a graph
    of processes and as a single encapsulated composite.
- study: fig-06
  number: 6
  caption: >-
    Orchestration patterns, in bigraph-loom style. a: multi-timestepping — temporal
    processes each updating at their own interval, reading/writing a shared store at
    their update ticks. b: a workflow DAG of step processes over intermediate stores.
    c: event-driven graph rewrite — divide / engulf / burst events restructuring
    environ + agent subgraphs.
- study: fig-07
  number: 7
  caption: >-
    Three spatio-flux example composites with their simulation output: community dynamic FBA
    (shared fields + a dFBA process per species with Monod kinetics), COMETS-style spatial
    dFBA (fields on a grid with diffusion–advection and a single vectorized spatial-dFBA process over the whole lattice), and Brownian
    particles (a particles store driven by brownian motion with boundary enforcement).
- study: fig-08
  number: 8
  caption: >-
    The spatio-flux reference model — the combined spatial composite (particles, fields,
    diffusion–advection, and dynamic FBA) used as the reference simulation.
expert_docs: []
acceptance_criteria: []
# Investigation-level builder (analog of a study canonical_run): the workbench
# figures-build endpoint runs this so the download reflects the current saved views.
figures_build: python scripts/build_all_figures.py
