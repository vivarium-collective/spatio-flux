[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatio-flux"
version = "1.4.0"
description = "A demonstration of process composition rebuilding and extending COMETS by composing functional components"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bigraph-schema",
    "process-bigraph[ray,server-rest,ec2-ssm]",
    "bigraph-viz",
    "cobra",
    "highspy",
    "imageio",
    "ipython",
    "matplotlib",
    "pbg-superpowers>=0.16.0",
    "pymunk",
    "scipy",
]

[dependency-groups]
dev = [
    "build",
    "pytest",
]

#[tool.uv.sources]
#bigraph-schema = { path = "../bigraph-schema", editable = true }
#process-bigraph = { path = "../process-bigraph", editable = true }
#bigraph-viz = { path = "../bigraph-viz", editable = true }

# Make sure all subpackages are included
[tool.setuptools.packages.find]
where = ["."]
include = ["spatio_flux*"]
exclude = ["tests*", "docs*"]
