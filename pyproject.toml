# This repo is the spatio-flux SIMULATOR: the importable `spatio_flux` package
# (processes + composites) that ecosystem consumers (viva-casebook,
# discovery-showcase, …) depend on. The studies / investigations / workspace
# tooling now live in the spatio-flux-studies repo, which pins this package by
# git tag. (Inverted sim/studies split, mirrors viva-munk / viva-munk-studies.)
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "spatio-flux"
version = "1.5.5"
description = "A demonstration of process composition rebuilding and extending COMETS by composing functional components"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bigraph-schema>=1.4.3",
    "process-bigraph[ray,server-rest,ec2-ssm]>=1.8.5",  # >=1.8.0 provides composite_generator core_extensions
    "bigraph-viz",
    "cobra",
    "highspy",
    "imageio",
    "ipython",
    "matplotlib",
    "pbg-superpowers>=0.23.0",  # >=0.23 drops the _emitter_node_from_decl import removed in process-bigraph #258
    "pymunk",
    "scipy",
]

[dependency-groups]
dev = [
    "build",
    "pytest",
]

#[tool.uv.sources]
#bigraph-schema = { path = "../bigraph-schema", editable = true }
#process-bigraph = { path = "../process-bigraph", editable = true }
#bigraph-viz = { path = "../bigraph-viz", editable = true }

# Ship the whole spatio_flux/ import package (every subpackage). hatchling bundles
# package data (the SBML models under spatio_flux/models/*.xml) by default. The
# workspace content (studies / investigations / workspace.yaml) is no longer
# force-included here — it lives in spatio-flux-studies now.
[tool.hatch.build.targets.wheel]
packages = ["spatio_flux"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so the package tests import `spatio_flux`.
pythonpath = ["."]
