[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatio-flux"
version = "1.5.0"
description = "A demonstration of process composition rebuilding and extending COMETS by composing functional components"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bigraph-schema>=1.4.3",
    "process-bigraph[ray,server-rest,ec2-ssm]>=1.8.2",  # >=1.8.0 provides composite_generator core_extensions
    "bigraph-viz",
    "cobra",
    "highspy",
    "imageio",
    "ipython",
    "matplotlib",
    "pbg-superpowers>=0.16",  # re-exports process_bigraph.composite_generator (core_extensions)
    "pymunk",
    "scipy",
]

[dependency-groups]
dev = [
    "build",
    "pytest",
]

#[tool.uv.sources]
#bigraph-schema = { path = "../bigraph-schema", editable = true }
#process-bigraph = { path = "../process-bigraph", editable = true }
#bigraph-viz = { path = "../bigraph-viz", editable = true }

# Make sure all subpackages are included
[tool.setuptools.packages.find]
where = ["."]
include = ["spatio_flux*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import both `spatio_flux` and
# `scripts` (the scaffolder/report modules) without a PYTHONPATH env var —
# matches how CI runs `pytest tests/`.
pythonpath = ["."]
