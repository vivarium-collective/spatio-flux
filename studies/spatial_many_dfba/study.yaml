schema_version: 3
name: spatial_many_dfba
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.spatial.spatial_many_dfba
  params:
    model_id: ecoli core
purpose:
  question: 'Spatial microenvironment (sitewise dFBA): a lattice where each site runs
    its own dFBA instance. Useful for validating lattice indexing + per-site state
    isolation.'
  mechanism: Runs the spatio_flux.composites.spatial.spatial_many_dfba composite (pair
    composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_core_dfba
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - spatial_many_dfba
  - '60'
  label: reproduce spatial_many_dfba figures
  default: true
visualizations:
- name: spatial_many_dfba_timeseries.png
  address: image:charts/spatial_many_dfba_timeseries.png
  chart: image
- name: spatial_many_dfba_video.gif
  address: image:charts/spatial_many_dfba_video.gif
  chart: image
- name: spatial_many_dfba_viz.png
  address: image:charts/spatial_many_dfba_viz.png
  chart: image
- name: spatial_many_dfba_schema.json
  address: image:charts/spatial_many_dfba_schema.json
  chart: image
- name: spatial_many_dfba_state.json
  address: image:charts/spatial_many_dfba_state.json
  chart: image
behavior_tests:
- name: SPATIAL_MANY_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - spatial_many_dfba_timeseries.png
    - spatial_many_dfba_video.gif
    - spatial_many_dfba_viz.png
    - spatial_many_dfba_schema.json
    - spatial_many_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
