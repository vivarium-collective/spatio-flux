schema_version: 3
name: community_dfba
created: '2026-07-26'
status: complete
phase: Evaluate
design_status: complete
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
purpose:
  question: 'Multi-agent well-mixed community: several independent dFBA instances share the same extracellular pools, creating competition / cross-feeding dynamics without space.'
  mechanism: Runs the spatio_flux.composites.metabolism.community_dfba composite (pair composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_dfba
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - community_dfba
  - '60'
  label: reproduce community_dfba figures
  default: true
visualizations:
- name: community_dfba.svg
  address: image:visualizations/community_dfba.svg
  chart: image
- name: community_dfba.png
  address: image:charts/community_dfba.png
  chart: image
behavior_tests:
- name: COMMUNITY_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All 4 expected artifacts are produced in charts/, and the composite's structural schema (community_dfba_schema.json) matches the committed reference in studies/<slug>/reference/. State/figures embed RNG or non-deterministic renders, so they are existence-checked.
  measure:
    kind: artifacts_present
    expected:
    - community_dfba.png
    - community_dfba_viz.png
    - community_dfba_schema.json
    - community_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.0
  requires_simulation: reproduce
- name: COMMUNITY-DFBA-ECOLI-CORE-GROWS
  classification: primary
  description: ecoli core increases monotonically over the run.
  measure:
    kind: observable_monotone
    slug: community_dfba
    observable: ecoli core
    direction: increasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
- name: COMMUNITY-DFBA-GLUCOSE-DEPLETES
  classification: primary
  description: glucose decreases monotonically as it is consumed.
  measure:
    kind: observable_monotone
    slug: community_dfba
    observable: glucose
    direction: decreasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
runs:
- name: community_dfba-reproduce
  run_id: community_dfba-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.metabolism.community_dfba
  emitter:
    kind: xarray
    store: studies/community_dfba/runs.community_dfba-reproduce.zarr
  store_path: studies/community_dfba/runs.community_dfba-reproduce.zarr
  timestamp: '2026-09-20T15:24:04Z'
  result: PASS
  outcomes:
    COMMUNITY_DFBA-REPRODUCES-REPORT:
      result: PASS
      evaluated_by: code
      detail: 4/4 artifacts present; community_dfba_schema.json matches reference (structural, tol=0.0)
    COMMUNITY-DFBA-ECOLI-CORE-GROWS:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [0,0.02728]; start 0.1 end 0.4609; tol 0.01
    COMMUNITY-DFBA-GLUCOSE-DEPLETES:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/decreasing
      detail: decreasing; steps [-0.619,0]; start 10 end 0; tol 0.01
findings:
- id: F1
  kind: computational
  status: passed
  statement: spatio_flux reproduces the community_dfba test-suite artifacts and the composite's structural schema matches its committed reference.
  evidence:
    from_test: COMMUNITY_DFBA-REPRODUCES-REPORT
  provenance:
    run_ids:
    - community_dfba-reproduce
- id: F2
  kind: biological
  status: confirms
  statement: Glucose is driven to exhaustion while the E. coli-core species biomass grows, establishing the shared-pool competition the scenario models.
  evidence:
    from_test: COMMUNITY-DFBA-ECOLI-CORE-GROWS
  provenance:
    run_ids:
    - community_dfba-reproduce
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The community_dfba scenario is faithfully reproduced by the investigation's post-run analysis flush.
    biological_validation: Validates that the composition reproduces the reference test-suite artifacts; it does not add new biological claims beyond the original scenario.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - Compare charts/<slug>_schema.json against studies/<slug>/reference/.
    - Check the composite build and the FLUSH_SPEC config for this slug.
    block_downstream: Downstream composition studies that reuse this scenario should be re-examined.
conditions:
  baseline:
    name: baseline
    composite: spatio_flux.composites.metabolism.community_dfba
    params: {}
  model_settings: []
question: 'Multi-agent well-mixed community: several independent dFBA instances share the same extracellular pools, creating competition / cross-feeding dynamics without space.'
claim: In a shared-substrate community, glucose is depleted while the E. coli-core population grows — the setting for competition and cross-feeding.
