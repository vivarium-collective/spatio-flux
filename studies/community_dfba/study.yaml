schema_version: 3
name: community_dfba
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.metabolism.community_dfba
  params: {}
purpose:
  question: 'Multi-agent well-mixed community: several independent dFBA instances
    share the same extracellular pools, creating competition / cross-feeding dynamics
    without space.'
  mechanism: Runs the spatio_flux.composites.metabolism.community_dfba composite (pair
    composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_dfba
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - community_dfba
  - '60'
  label: reproduce community_dfba figures
  default: true
visualizations:
- name: community_dfba
  address: image:charts/community_dfba
  chart: image
- name: community_dfba_viz.png
  address: image:charts/community_dfba_viz.png
  chart: image
- name: community_dfba_schema.json
  address: image:charts/community_dfba_schema.json
  chart: image
- name: community_dfba_state.json
  address: image:charts/community_dfba_state.json
  chart: image
behavior_tests:
- name: COMMUNITY_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - community_dfba
    - community_dfba_viz.png
    - community_dfba_schema.json
    - community_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
