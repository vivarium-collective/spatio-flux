schema_version: 3
name: dfba_kinetics_community
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.metabolism.dfba_kinetics_community
  params: {}
purpose:
  question: 'Hybrid community (well-mixed): mixes Monod-kinetic agents with dFBA agents
    in a shared environment. Demonstrates heterogeneous process composition under
    one schema.'
  mechanism: Runs the spatio_flux.composites.metabolism.dfba_kinetics_community composite
    (pair composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_core_dfba
  - monod_kinetics
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - dfba_kinetics_community
  - '60'
  label: reproduce dfba_kinetics_community figures
  default: true
visualizations:
- name: dfba_kinetics_community
  address: image:charts/dfba_kinetics_community
  chart: image
- name: dfba_kinetics_community_viz.png
  address: image:charts/dfba_kinetics_community_viz.png
  chart: image
- name: dfba_kinetics_community_schema.json
  address: image:charts/dfba_kinetics_community_schema.json
  chart: image
- name: dfba_kinetics_community_state.json
  address: image:charts/dfba_kinetics_community_state.json
  chart: image
behavior_tests:
- name: DFBA_KINETICS_COMMUNITY-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - dfba_kinetics_community
    - dfba_kinetics_community_viz.png
    - dfba_kinetics_community_schema.json
    - dfba_kinetics_community_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
