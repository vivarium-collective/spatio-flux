schema_version: 3
name: ecoli_dfba
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.metabolism.ecoli_dfba
  params:
    model_id: ecoli
    glucose: 10.0
    formate: 5.0
purpose:
  question: 'Single-cell metabolism (large model): dynamic FBA using iAF1260 with
    tracked extracellular fields (glucose/formate) and biomass. Stress-tests solver
    + exchange wiring.'
  mechanism: Runs the spatio_flux.composites.metabolism.ecoli_dfba composite (standalone
    process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - ecoli_dfba
  - '60'
  label: reproduce ecoli_dfba figures
  default: true
visualizations:
- name: ecoli_dfba.png
  address: image:charts/ecoli_dfba.png
  chart: image
- name: ecoli_dfba_viz.png
  address: image:charts/ecoli_dfba_viz.png
  chart: image
- name: ecoli_dfba_schema.json
  address: image:charts/ecoli_dfba_schema.json
  chart: image
- name: ecoli_dfba_state.json
  address: image:charts/ecoli_dfba_state.json
  chart: image
behavior_tests:
- name: ECOLI_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - ecoli_dfba.png
    - ecoli_dfba_viz.png
    - ecoli_dfba_schema.json
    - ecoli_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
