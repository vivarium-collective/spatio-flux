behavior_tests:
- name: COMETS_BR_PARTICLES_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - comets_br_particles_dfba_timeseries.png
    - comets_br_particles_dfba_mass.png
    - comets_br_particles_dfba_snapshots.png
    - comets_br_particles_dfba_video.gif
    - comets_br_particles_dfba_viz.png
    - comets_br_particles_dfba_schema.json
    - comets_br_particles_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
