  address: image:charts/comets_br_particles_dfba_mass.png
  chart: image
- name: comets_br_particles_dfba_snapshots.png
  address: image:charts/comets_br_particles_dfba_snapshots.png
  chart: image
- name: comets_br_particles_dfba_video.gif
  address: image:charts/comets_br_particles_dfba_video.gif
  chart: image
- name: comets_br_particles_dfba_viz.png
  address: image:charts/comets_br_particles_dfba_viz.png
  chart: image
- name: comets_br_particles_dfba_schema.json
  address: image:charts/comets_br_particles_dfba_schema.json
  chart: image
