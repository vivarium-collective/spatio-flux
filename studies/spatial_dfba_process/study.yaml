schema_version: 3
name: spatial_dfba_process
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.spatial.spatial_dfba_process
  params: {}
purpose:
  question: 'Spatial microenvironment (vectorized dFBA): one spatial dFBA process
    updates all lattice sites as a single structured state. Demonstrates batched execution
    + field coupling.'
  mechanism: Runs the spatio_flux.composites.spatial.spatial_dfba_process composite
    (pair composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_core_dfba
  - diffusion_process
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - spatial_dfba_process
  - '60'
  label: reproduce spatial_dfba_process figures
  default: true
visualizations:
- name: spatial_dfba_process_timeseries.png
  address: image:charts/spatial_dfba_process_timeseries.png
  chart: image
- name: spatial_dfba_process_model_grid.png
  address: image:charts/spatial_dfba_process_model_grid.png
  chart: image
- name: spatial_dfba_process_video.gif
  address: image:charts/spatial_dfba_process_video.gif
  chart: image
- name: spatial_dfba_process_viz.png
  address: image:charts/spatial_dfba_process_viz.png
  chart: image
- name: spatial_dfba_process_schema.json
  address: image:charts/spatial_dfba_process_schema.json
  chart: image
- name: spatial_dfba_process_state.json
  address: image:charts/spatial_dfba_process_state.json
  chart: image
behavior_tests:
- name: SPATIAL_DFBA_PROCESS-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - spatial_dfba_process_timeseries.png
    - spatial_dfba_process_model_grid.png
    - spatial_dfba_process_video.gif
    - spatial_dfba_process_viz.png
    - spatial_dfba_process_schema.json
    - spatial_dfba_process_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
