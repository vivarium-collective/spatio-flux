behavior_tests:
- name: BR_PARTICLES_KINETICS-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - br_particles_kinetics_video.gif
    - br_particles_kinetics_mass.png
    - br_particles_kinetics_snapshots.png
    - br_particles_kinetics_particles_traces.png
    - br_particles_kinetics_viz.png
    - br_particles_kinetics_schema.json
    - br_particles_kinetics_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
