  address: image:charts/br_particles_kinetics_mass.png
  chart: image
- name: br_particles_kinetics_snapshots.png
  address: image:charts/br_particles_kinetics_snapshots.png
  chart: image
- name: br_particles_kinetics_particles_traces.png
  address: image:charts/br_particles_kinetics_particles_traces.png
  chart: image
- name: br_particles_kinetics_viz.png
  address: image:charts/br_particles_kinetics_viz.png
  chart: image
- name: br_particles_kinetics_schema.json
  address: image:charts/br_particles_kinetics_schema.json
