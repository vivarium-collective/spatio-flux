schema_version: 3
name: glucose_limitation_yield
investigation: spatio-flux-test-suite
title: Glucose-limitation yield response
status: complete
phase: Evaluate
confidence: Accepted
claim: 'Final dynamic-FBA biomass scales with the initial glucose supply: a glucose-limited cell (2 mM) reaches roughly a quarter of the biomass of a glucose-replete cell (10 mM), the quantitative carbon-limitation response.'
purpose:
  question: Does the biomass yield of dynamic-FBA growth scale with the initial glucose supply — the quantitative signature of carbon limitation?
  mechanism: 'New biology-forward study (discovery engine): a new configuration/analysis of a real spatio-flux composite.'
  expected_outcome: The quantitative behavior tests pass, confirming the stated emergent/metabolic claim.
question: Does the biomass yield of dynamic-FBA growth scale with the initial glucose supply — the quantitative signature of carbon limitation?
conditions:
  baseline:
  - name: low-glucose
    composite: spatio_flux.composites.metabolism.ecoli_core_dfba
    params:
      glucose: 2.0
      acetate: 0.0
  - name: high-glucose
    composite: spatio_flux.composites.metabolism.ecoli_core_dfba
    params:
      glucose: 10.0
      acetate: 0.0
  model_settings: []
canonical_runs:
- name: reproduce-low
  script: spatio_flux/runners/run_new_study.py
  args:
  - glucose_limitation_yield
  - '80'
  - low-glucose
  - -low
  label: run glucose_limitation_yield-low
  default: true
- name: reproduce-high
  script: spatio_flux/runners/run_new_study.py
  args:
  - glucose_limitation_yield
  - '80'
  - high-glucose
  - -high
  label: run glucose_limitation_yield-high
  default: false
visualizations:
- name: glucose_limitation_yield-low trajectory
  address: image:charts/glucose_limitation_yield-low_trajectory.png
  chart: image
- name: glucose_limitation_yield-high trajectory
  address: image:charts/glucose_limitation_yield-high_trajectory.png
  chart: image
behavior_tests:
- name: GLUCOSE-LIMITATION-LOW-YIELD
  classification: primary
  description: glucose-limited (2 mM) final biomass lands in the low-yield band.
  measure:
    kind: observable_band
    slug: glucose_limitation_yield
    observable: biomass
    run_id: glucose_limitation_yield-low-reproduce
    expected:
    - 0.18
    - 0.4
  pass_if:
    op: band
  requires_simulation: reproduce
- name: GLUCOSE-LIMITATION-HIGH-YIELD
  classification: primary
  description: glucose-replete (10 mM) final biomass lands in the high-yield band.
  measure:
    kind: observable_band
    slug: glucose_limitation_yield
    observable: biomass
    run_id: glucose_limitation_yield-high-reproduce
    expected:
    - 0.8
    - 1.15
  pass_if:
    op: band
  requires_simulation: reproduce
findings:
- id: F1
  kind: biological
  status: confirms
  statement: 'Biomass yield tracks the carbon supply: 2 mM glucose yields ~0.26 biomass vs ~0.96 at 10 mM — a ~4x yield difference set by the initial glucose, the quantitative carbon-limitation response (a real biological claim, not an artifact check).'
  evidence:
    from_test: GLUCOSE-LIMITATION-HIGH-YIELD
  provenance:
    run_ids:
    - glucose_limitation_yield-low-reproduce
    - glucose_limitation_yield-high-reproduce
discovery_implications:
  resolved:
  - Dynamic-FBA biomass yield scales with initial glucose.
  remaining:
  - Whether the yield-vs-glucose relationship is linear or saturating across a wider range is unmeasured.
  followup_study_proposals:
  - id: yield-vs-glucose-dose-response
    motivation: Two points show scaling; a glucose dose-response sweep would map whether yield is linear or saturating in the carbon supply.
    candidate: ecoli_core_dfba sweep over glucose
runs:
- name: glucose_limitation_yield-low-reproduce
  run_id: glucose_limitation_yield-low-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.metabolism.ecoli_core_dfba
  emitter:
    kind: xarray
    store: studies/glucose_limitation_yield/runs.glucose_limitation_yield-low-reproduce.zarr
  store_path: studies/glucose_limitation_yield/runs.glucose_limitation_yield-low-reproduce.zarr
  outcomes:
    GLUCOSE-LIMITATION-LOW-YIELD:
      result: PASS
      evaluated_by: code
      operator: observable_band
      detail: final 0.2616 vs band [0.18,0.4]
- name: glucose_limitation_yield-high-reproduce
  run_id: glucose_limitation_yield-high-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.metabolism.ecoli_core_dfba
  emitter:
    kind: xarray
    store: studies/glucose_limitation_yield/runs.glucose_limitation_yield-high-reproduce.zarr
  store_path: studies/glucose_limitation_yield/runs.glucose_limitation_yield-high-reproduce.zarr
  outcomes:
    GLUCOSE-LIMITATION-HIGH-YIELD:
      result: PASS
      evaluated_by: code
      operator: observable_band
      detail: final 0.9556 vs band [0.8,1.15]
gate_status: passed
