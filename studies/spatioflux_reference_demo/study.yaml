schema_version: 3
name: spatioflux_reference_demo
created: '2026-07-26'
status: complete
phase: Evaluate
design_status: complete
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
baseline:
- name: baseline
  composite: spatio_flux.composites.reference.spatioflux_reference_demo
  params:
    n_bins:
    - 10
    - 10
purpose:
  question: 'SpatioFlux demonstration reference composite: Newtonian motile particles
    + particle–field exchange + internal multi-dFBA + Monod/diffusion fields + mass-aggregated
    division.'
  mechanism: Runs the spatio_flux.composites.reference.spatioflux_reference_demo composite
    (reference demo).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - comets_nt_particles_dfba
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - spatioflux_reference_demo
  - '120'
  label: reproduce spatioflux_reference_demo figures
  default: true
visualizations:
- name: spatioflux_reference_demo.svg
  address: image:visualizations/spatioflux_reference_demo.svg
  chart: image
- name: spatioflux_reference_demo_timeseries.png
  address: image:charts/spatioflux_reference_demo_timeseries.png
  chart: image
- name: spatioflux_reference_demo_snapshots.png
  address: image:charts/spatioflux_reference_demo_snapshots.png
  chart: image
- name: spatioflux_reference_demo_mass.png
  address: image:charts/spatioflux_reference_demo_mass.png
  chart: image
- name: spatioflux_reference_demo_mass_submasses.png
  address: image:charts/spatioflux_reference_demo_mass_submasses.png
  chart: image
behavior_tests:
- name: SPATIOFLUX_REFERENCE_DEMO-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - spatioflux_reference_demo_timeseries.png
    - spatioflux_reference_demo_mass.png
    - spatioflux_reference_demo_mass_submasses.png
    - spatioflux_reference_demo_video.gif
    - spatioflux_reference_demo_snapshots.png
    - spatioflux_reference_demo_viz.png
    - spatioflux_reference_demo_schema.json
    - spatioflux_reference_demo_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
runs:
- name: spatioflux_reference_demo-reproduce
  run_id: spatioflux_reference_demo-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.reference.spatioflux_reference_demo
  emitter:
    kind: xarray
    store: studies/spatioflux_reference_demo/runs.spatioflux_reference_demo-reproduce.zarr
  store_path: studies/spatioflux_reference_demo/runs.spatioflux_reference_demo-reproduce.zarr
  timestamp: '2026-07-26T12:00:00Z'
  result: PASS
  outcomes:
    SPATIOFLUX_REFERENCE_DEMO-REPRODUCES-REPORT:
      result: PASS
      detail: All 8 report artifacts reproduced via the post-run analysis flush; deterministic
        scenarios match the out0 reference within tolerance.
findings:
- id: F1
  kind: computational
  status: passed
  statement: spatio_flux reproduces the spatioflux_reference_demo test-suite report
    artifacts via the post-run analysis flush.
  evidence:
    from_test: SPATIOFLUX_REFERENCE_DEMO-REPRODUCES-REPORT
  provenance:
    run_ids:
    - spatioflux_reference_demo-reproduce
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The spatioflux_reference_demo scenario is faithfully reproduced
      by the investigation's post-run analysis flush.
    biological_validation: Validates that the composition reproduces the reference
      test-suite artifacts; it does not add new biological claims beyond the original
      scenario.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - Compare the produced charts/<slug>_* artifacts against out0/.
    - Check the composite build and the FLUSH_SPEC config for this slug.
    block_downstream: Downstream composition studies that reuse this scenario should
      be re-examined.
