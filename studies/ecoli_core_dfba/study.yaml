schema_version: 3
name: ecoli_core_dfba
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.metabolism.ecoli_core_dfba
  params:
    model_id: ecoli core
    glucose: 10.0
    acetate: 0.0
purpose:
  question: 'Single-cell metabolism baseline: dynamic FBA for E. coli core with external
    glucose/acetate and biomass over time (no space, no particles).'
  mechanism: Runs the spatio_flux.composites.metabolism.ecoli_core_dfba composite
    (standalone process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - ecoli_core_dfba
  - '60'
  label: reproduce ecoli_core_dfba figures
  default: true
visualizations:
- name: ecoli_core_dfba.png
  address: image:charts/ecoli_core_dfba.png
  chart: image
- name: ecoli_core_dfba_viz.png
  address: image:charts/ecoli_core_dfba_viz.png
  chart: image
- name: ecoli_core_dfba_schema.json
  address: image:charts/ecoli_core_dfba_schema.json
  chart: image
- name: ecoli_core_dfba_state.json
  address: image:charts/ecoli_core_dfba_state.json
  chart: image
behavior_tests:
- name: ECOLI_CORE_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - ecoli_core_dfba.png
    - ecoli_core_dfba_viz.png
    - ecoli_core_dfba_schema.json
    - ecoli_core_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
