schema_version: 3
name: spatial_growth_front
investigation: spatio-flux-test-suite
title: Spatial growth front
status: complete
phase: Evaluate
confidence: Accepted
claim: 'Biomass seeded at the top edge of the COMETS field forms an advection-driven growth front: it propagates down the lattice (front position advances), its centroid migrates downstream, and its spatial spread grows as the population feeds and is transported through the field.'
purpose:
  question: When biomass is seeded at one edge of a diffusing nutrient field, does it propagate across the lattice as an emergent spatial growth front?
  mechanism: 'New biology-forward study (discovery engine): a new configuration/analysis of a real spatio-flux composite.'
  expected_outcome: The quantitative behavior tests pass, confirming the stated emergent/metabolic claim.
question: When biomass is seeded at one edge of a diffusing nutrient field, does it propagate across the lattice as an emergent spatial growth front?
conditions:
  baseline:
    name: baseline
    composite: spatio_flux.composites.comets.comets_diffusion
    params: {}
  model_settings: []
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_new_study.py
  args:
  - spatial_growth_front
  - '60'
  label: run spatial_growth_front
  default: true
visualizations:
- name: spatial_growth_front trajectory
  address: image:charts/spatial_growth_front_trajectory.png
  chart: image
behavior_tests:
- name: SPATIAL-GROWTH-FRONT-ADVANCES
  classification: primary
  description: the biomass front (first row above threshold) advances down the lattice.
  measure:
    kind: front_advances
    slug: spatial_growth_front
    observable: dissolved biomass
    run_id: spatial_growth_front-reproduce
    threshold: 0.02
  pass_if:
    op: front_advances
    tolerance: 0.0
  requires_simulation: reproduce
- name: SPATIAL-GROWTH-FRONT-CENTROID-MIGRATES
  classification: primary
  description: the biomass centroid migrates downstream along y (directed plume).
  measure:
    kind: centroid_shift
    slug: spatial_growth_front
    observable: dissolved biomass
    run_id: spatial_growth_front-reproduce
    axis: y
    min_shift: 1.5
  pass_if:
    op: centroid_shift
  requires_simulation: reproduce
- name: SPATIAL-GROWTH-FRONT-SPREAD-GROWS
  classification: primary
  description: the biomass radius of gyration grows (spatial spread).
  measure:
    kind: spread_grows
    slug: spatial_growth_front
    observable: dissolved biomass
    run_id: spatial_growth_front-reproduce
  pass_if:
    op: spread_grows
    tolerance: 0.0
  requires_simulation: reproduce
findings:
- id: F1
  kind: biological
  status: confirms
  statement: Biomass seeded at one edge forms an advancing growth front — front position advances, centroid migrates downstream, spread grows — as growing biomass is transported by the field's advection-diffusion. This spatial front is a behavior the well-mixed metabolism studies cannot exhibit (growth is coupled to spatial transport, not purely self-organized).
  evidence:
    from_test: SPATIAL-GROWTH-FRONT-ADVANCES
  provenance:
    run_ids:
    - spatial_growth_front-reproduce
    - spatial_growth_front-reproduce
    - spatial_growth_front-reproduce
  tier: interpretation
  mechanism_origin: engineered
discovery_implications:
  resolved:
  - A biomass front propagates across the COMETS lattice under advection-diffusion.
  remaining:
  - The front velocity's dependence on the diffusion vs growth balance is unquantified.
  followup_study_proposals:
  - id: diffusion-growth-phase-diagram
    motivation: The front advances, but is its velocity (and whether the colony stays localized or disperses) set by the diffusion/growth ratio? Sweep diffusion_rate to map the regime boundary.
    candidate: comets_spatial_dfba sweep over diffusion_rate
runs:
- name: spatial_growth_front-reproduce
  run_id: spatial_growth_front-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.comets.comets_diffusion
  emitter:
    kind: xarray
    store: studies/spatial_growth_front/runs.spatial_growth_front-reproduce.zarr
  store_path: studies/spatial_growth_front/runs.spatial_growth_front-reproduce.zarr
  outcomes:
    SPATIAL-GROWTH-FRONT-ADVANCES:
      result: PASS
      evaluated_by: code
      operator: front_advances
      detail: front 0->7 (thr 0.02); non-decreasing within tol 0.0
    SPATIAL-GROWTH-FRONT-CENTROID-MIGRATES:
      result: PASS
      evaluated_by: code
      operator: centroid_shift
      detail: centroid y shift 3.4 vs min 1.5
    SPATIAL-GROWTH-FRONT-SPREAD-GROWS:
      result: PASS
      evaluated_by: code
      operator: spread_grows
      detail: radius of gyration 0.5->1.84 (grows within tol 0.0)
  computed_outcomes:
    SPATIAL-GROWTH-FRONT-ADVANCES:
      result: PASS
      measured_value: 7.0
      evaluated_by: code
      operator: front_advances
      detail: front 0->7 (thr 0.02); non-decreasing within tol 0.0
      reconcile: agree
    SPATIAL-GROWTH-FRONT-CENTROID-MIGRATES:
      result: PASS
      measured_value: 3.4026854179544586
      evaluated_by: code
      operator: centroid_shift
      detail: centroid y shift 3.4 vs min 1.5
      reconcile: agree
    SPATIAL-GROWTH-FRONT-SPREAD-GROWS:
      result: PASS
      measured_value: 1.8428978901464839
      evaluated_by: code
      operator: spread_grows
      detail: radius of gyration 0.5->1.84 (grows within tol 0.0)
      reconcile: agree
gate_status: passed
falsifiability: If the biomass front position and centroid did not advance from the seed edge despite biomass growth, the 'propagating growth front' claim would be false.
limitations:
- comets_diffusion carries an imposed advection field, so the front is advection-driven transport of growing biomass, not purely self-organized pattern formation; a no-advection control / Fisher-KPP velocity calibration is not included.
- A single lattice, advection, and horizon.
alternative_hypotheses:
- hypothesis: The advancing front is passive diffusion/advection of the seeded band, with no growth.
  excluded_by: Total biomass grows many-fold over the run, so the front carries newly produced biomass, not merely transported seed.
- hypothesis: The front is self-organized pattern formation independent of the imposed flow.
  excluded_by: NOT excluded — advection is imposed by the composite; the claim is limited to an advection-driven growth front (a no-advection control is the proposed follow-up).
