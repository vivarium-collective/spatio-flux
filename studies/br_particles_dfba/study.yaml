schema_version: 3
name: br_particles_dfba
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.particles.br_particles_dfba
  params:
    particle_model_id: ecoli core
purpose:
  question: 'Particle-embedded metabolism: Brownian agents carry internal dFBA; uptake/secretion
    couples to fields and biomass accumulates into particle mass/size.'
  mechanism: Runs the spatio_flux.composites.particles.br_particles_dfba composite
    (pair composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - brownian_particles
  - ecoli_core_dfba
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - br_particles_dfba
  - '200'
  label: reproduce br_particles_dfba figures
  default: true
visualizations:
- name: br_particles_dfba_video.gif
  address: image:charts/br_particles_dfba_video.gif
  chart: image
- name: br_particles_dfba_mass.png
  address: image:charts/br_particles_dfba_mass.png
  chart: image
- name: br_particles_dfba_snapshots.png
  address: image:charts/br_particles_dfba_snapshots.png
  chart: image
- name: br_particles_dfba_particles_traces.png
  address: image:charts/br_particles_dfba_particles_traces.png
  chart: image
- name: br_particles_dfba_viz.png
  address: image:charts/br_particles_dfba_viz.png
  chart: image
- name: br_particles_dfba_schema.json
  address: image:charts/br_particles_dfba_schema.json
  chart: image
- name: br_particles_dfba_state.json
  address: image:charts/br_particles_dfba_state.json
  chart: image
behavior_tests:
- name: BR_PARTICLES_DFBA-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - br_particles_dfba_video.gif
    - br_particles_dfba_mass.png
    - br_particles_dfba_snapshots.png
    - br_particles_dfba_particles_traces.png
    - br_particles_dfba_viz.png
    - br_particles_dfba_schema.json
    - br_particles_dfba_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
