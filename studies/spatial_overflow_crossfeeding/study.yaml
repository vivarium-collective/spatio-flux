schema_version: 3
name: spatial_overflow_crossfeeding
investigation: spatio-flux-test-suite
title: Spatial overflow & cross-feeding substrate
status: complete
phase: Evaluate
confidence: Accepted
claim: Spatial dFBA on the COMETS field secretes acetate (overflow metabolism) that accumulates in the field while biomass grows and glucose begins to be drawn down — establishing the acetate pool a cross-feeding partner would exploit.
purpose:
  question: Does spatial dynamic-FBA secrete an overflow metabolite (acetate) into the field as it grows on glucose, building the substrate pool that spatial cross-feeding would draw on?
  mechanism: 'New biology-forward study (discovery engine): a new configuration/analysis of a real spatio-flux composite.'
  expected_outcome: The quantitative behavior tests pass, confirming the stated emergent/metabolic claim.
question: Does spatial dynamic-FBA secrete an overflow metabolite (acetate) into the field as it grows on glucose, building the substrate pool that spatial cross-feeding would draw on?
conditions:
  baseline:
    name: baseline
    composite: spatio_flux.composites.comets.comets_diffusion
    params: {}
  model_settings: []
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_new_study.py
  args:
  - spatial_overflow_crossfeeding
  - '60'
  label: run spatial_overflow_crossfeeding
  default: true
visualizations:
- name: spatial_overflow_crossfeeding trajectory
  address: image:charts/spatial_overflow_crossfeeding_trajectory.png
  chart: image
behavior_tests:
- name: SPATIAL-OVERFLOW-ACETATE-ACCUMULATES
  classification: primary
  description: total acetate in the field rises as an overflow byproduct.
  measure:
    kind: observable_monotone
    slug: spatial_overflow_crossfeeding
    observable: acetate
    run_id: spatial_overflow_crossfeeding-reproduce
    direction: increasing
  pass_if:
    op: monotone
    tolerance: 0.02
  requires_simulation: reproduce
- name: SPATIAL-OVERFLOW-BIOMASS-GROWS
  classification: primary
  description: total biomass grows.
  measure:
    kind: observable_monotone
    slug: spatial_overflow_crossfeeding
    observable: dissolved biomass
    run_id: spatial_overflow_crossfeeding-reproduce
    direction: increasing
  pass_if:
    op: monotone
    tolerance: 0.02
  requires_simulation: reproduce
- name: SPATIAL-OVERFLOW-GLUCOSE-DEPLETES
  classification: primary
  description: total glucose is drawn down over the run (monotone decreasing; only ~5% over this horizon on the large lattice).
  measure:
    kind: observable_monotone
    slug: spatial_overflow_crossfeeding
    observable: glucose
    run_id: spatial_overflow_crossfeeding-reproduce
    direction: decreasing
  pass_if:
    op: monotone
    tolerance: 0.02
  requires_simulation: reproduce
findings:
- id: F1
  kind: biological
  status: confirms
  statement: As the spatial population grows on glucose it secretes acetate into the field (overflow metabolism), accumulating the very substrate a cross-feeding partner would consume — the spatial precondition for cross-feeding, measured directly.
  evidence:
    from_test: SPATIAL-OVERFLOW-ACETATE-ACCUMULATES
  provenance:
    run_ids:
    - spatial_overflow_crossfeeding-reproduce
    - spatial_overflow_crossfeeding-reproduce
    - spatial_overflow_crossfeeding-reproduce
  tier: mechanism
discovery_implications:
  resolved:
  - Acetate accumulates in the field as an overflow byproduct of spatial growth on glucose.
  remaining:
  - Whether the secreted acetate is re-consumed (true cross-feeding) once glucose is locally exhausted is not yet observed at this horizon.
  followup_study_proposals:
  - id: acetate-reuptake-after-glucose-exhaustion
    motivation: Acetate only accumulates here because glucose is far from exhausted on the large lattice. Run to glucose exhaustion (or a glucose-limited field) to test whether acetate is re-consumed — the peak-then-decline cross-feeding signature.
    candidate: comets_diffusion, longer horizon / reduced initial glucose
runs:
- name: spatial_overflow_crossfeeding-reproduce
  run_id: spatial_overflow_crossfeeding-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.comets.comets_diffusion
  emitter:
    kind: xarray
    store: studies/spatial_overflow_crossfeeding/runs.spatial_overflow_crossfeeding-reproduce.zarr
  store_path: studies/spatial_overflow_crossfeeding/runs.spatial_overflow_crossfeeding-reproduce.zarr
  outcomes:
    SPATIAL-OVERFLOW-ACETATE-ACCUMULATES:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [0,0.02069]; start 0 end 0.2409; tol 0.02
    SPATIAL-OVERFLOW-BIOMASS-GROWS:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [0.007999,0.1041]; start 0.2 end 2.771; tol 0.02
    SPATIAL-OVERFLOW-GLUCOSE-DEPLETES:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/decreasing
      detail: decreasing; steps [-1.163,0]; start 500.5 end 475.4; tol 0.02
  computed_outcomes:
    SPATIAL-OVERFLOW-ACETATE-ACCUMULATES:
      result: PASS
      measured_value: 0.2409094920227609
      evaluated_by: code
