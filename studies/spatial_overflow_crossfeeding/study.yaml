gate_status: passed
falsifiability: If acetate stayed at zero while biomass grew on glucose, the overflow-secretion claim would be false.
limitations:
- Acetate accumulation is shown; its re-consumption (true cross-feeding) is not reached at this horizon.
- Single COMETS parameterization.
alternative_hypotheses:
- hypothesis: The acetate rise is a numerical artifact of the field solver.
  excluded_by: Acetate accrues as glucose is consumed and biomass grows, and the zero-carbon control (nutrient_starvation_control) produces none.
