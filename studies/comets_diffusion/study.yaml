schema_version: 3
name: comets_diffusion
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.comets.comets_diffusion
  params: {}
purpose:
  question: "Two-phase coupling (no particles): spatial dFBA on a lattice with advection\u2013\
    diffusion of substrates + biomass. The classic COMETS field-only scenario."
  mechanism: Runs the spatio_flux.composites.comets.comets_diffusion composite (pair
    composition).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites:
  - ecoli_core_dfba
  - diffusion_process
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - comets_diffusion
  - '60'
  label: reproduce comets_diffusion figures
  default: true
visualizations:
- name: comets_diffusion_timeseries.png
  address: image:charts/comets_diffusion_timeseries.png
  chart: image
- name: comets_diffusion_snapshots.png
  address: image:charts/comets_diffusion_snapshots.png
  chart: image
- name: comets_diffusion_video.gif
  address: image:charts/comets_diffusion_video.gif
  chart: image
- name: comets_diffusion_viz.png
  address: image:charts/comets_diffusion_viz.png
  chart: image
- name: comets_diffusion_schema.json
  address: image:charts/comets_diffusion_schema.json
  chart: image
- name: comets_diffusion_state.json
  address: image:charts/comets_diffusion_state.json
  chart: image
behavior_tests:
- name: COMETS_DIFFUSION-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - comets_diffusion_timeseries.png
    - comets_diffusion_snapshots.png
    - comets_diffusion_video.gif
    - comets_diffusion_viz.png
    - comets_diffusion_schema.json
    - comets_diffusion_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
