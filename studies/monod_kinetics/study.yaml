schema_version: 3
name: monod_kinetics
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.metabolism.monod_kinetics
  params:
    model_id: overflow_metabolism
purpose:
  question: 'Field-only baseline: Monod uptake/growth on a well-mixed substrate pool
    (no spatial lattice, no particles). Use to sanity-check kinetics + mass balance.'
  mechanism: Runs the spatio_flux.composites.metabolism.monod_kinetics composite (standalone
    process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - monod_kinetics
  - '60'
  label: reproduce monod_kinetics figures
  default: true
visualizations:
- name: monod_kinetics.png
  address: image:charts/monod_kinetics.png
  chart: image
- name: monod_kinetics_viz.png
  address: image:charts/monod_kinetics_viz.png
  chart: image
- name: monod_kinetics_schema.json
  address: image:charts/monod_kinetics_schema.json
  chart: image
- name: monod_kinetics_state.json
  address: image:charts/monod_kinetics_state.json
  chart: image
behavior_tests:
- name: MONOD_KINETICS-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - monod_kinetics.png
    - monod_kinetics_viz.png
    - monod_kinetics_schema.json
    - monod_kinetics_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
