schema_version: 3
name: monod_kinetics
created: '2026-07-26'
status: complete
phase: Evaluate
design_status: complete
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
purpose:
  question: 'Field-only baseline: Monod uptake/growth on a well-mixed substrate pool (no spatial lattice, no particles). Use to sanity-check kinetics + mass balance.'
  mechanism: Runs the spatio_flux.composites.metabolism.monod_kinetics composite (standalone process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - monod_kinetics
  - '60'
  label: reproduce monod_kinetics figures
  default: true
visualizations:
- name: monod_kinetics.svg
  address: image:visualizations/monod_kinetics.svg
  chart: image
- name: monod_kinetics.png
  address: image:charts/monod_kinetics.png
  chart: image
behavior_tests:
- name: MONOD_KINETICS-REPRODUCES-REPORT
  classification: regression
  description: All 4 expected artifacts are produced in charts/, and the composite's structural schema (monod_kinetics_schema.json) matches the committed reference in studies/<slug>/reference/. State/figures embed RNG or non-deterministic renders, so they are existence-checked.
  measure:
    kind: artifacts_present
    expected:
    - monod_kinetics.png
    - monod_kinetics_viz.png
    - monod_kinetics_schema.json
    - monod_kinetics_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.0
  requires_simulation: reproduce
- name: MONOD-KINETICS-BIOMASS-GROWS
  classification: primary
  description: biomass increases monotonically over the run.
  measure:
    kind: observable_monotone
    slug: monod_kinetics
    observable: biomass
    direction: increasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
- name: MONOD-KINETICS-GLUCOSE-DEPLETES
  classification: primary
  description: glucose decreases monotonically as it is consumed.
  measure:
    kind: observable_monotone
    slug: monod_kinetics
    observable: glucose
    direction: decreasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
runs:
- name: monod_kinetics-reproduce
  run_id: monod_kinetics-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.metabolism.monod_kinetics
  emitter:
    kind: xarray
    store: studies/monod_kinetics/runs.monod_kinetics-reproduce.zarr
  store_path: studies/monod_kinetics/runs.monod_kinetics-reproduce.zarr
  timestamp: '2026-09-20T15:24:04Z'
  result: PASS
  outcomes:
    MONOD_KINETICS-REPRODUCES-REPORT:
      result: PASS
      evaluated_by: code
      detail: 4/4 artifacts present; monod_kinetics_schema.json matches reference (structural, tol=0.0)
    MONOD-KINETICS-GLUCOSE-DEPLETES:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/decreasing
      detail: decreasing; steps [-0.07138,-7.312e-35]; start 10 end 2.394e-34; tol 0.01
    MONOD-KINETICS-BIOMASS-GROWS:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [1.89e-13,0.01146]; start 0.1 end 1.671; tol 0.01
findings:
- id: F1
  kind: computational
  status: passed
  statement: spatio_flux reproduces the monod_kinetics test-suite artifacts and the composite's structural schema matches its committed reference.
  evidence:
    from_test: MONOD_KINETICS-REPRODUCES-REPORT
  provenance:
    run_ids:
    - monod_kinetics-reproduce
- id: F2
  kind: biological
  status: confirms
  statement: Biomass grows monotonically and glucose is driven to near-zero, the field-only Monod growth signature.
  evidence:
    from_test: MONOD-KINETICS-BIOMASS-GROWS
  provenance:
    run_ids:
    - monod_kinetics-reproduce
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The monod_kinetics scenario is faithfully reproduced by the investigation's post-run analysis flush.
    biological_validation: Validates that the composition reproduces the reference test-suite artifacts; it does not add new biological claims beyond the original scenario.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - Compare charts/<slug>_schema.json against studies/<slug>/reference/.
    - Check the composite build and the FLUSH_SPEC config for this slug.
    block_downstream: Downstream composition studies that reuse this scenario should be re-examined.
conditions:
  baseline:
    name: baseline
    composite: spatio_flux.composites.metabolism.monod_kinetics
    params:
      model_id: overflow_metabolism
  model_settings: []
question: 'Field-only baseline: Monod uptake/growth on a well-mixed substrate pool (no spatial lattice, no particles). Use to sanity-check kinetics + mass balance.'
claim: Monod uptake kinetics drive biomass growth and near-complete glucose depletion in a well-mixed pool.
