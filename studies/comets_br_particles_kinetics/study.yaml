behavior_tests:
- name: COMETS_BR_PARTICLES_KINETICS-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - comets_br_particles_kinetics_timeseries.png
    - comets_br_particles_kinetics_mass.png
    - comets_br_particles_kinetics_snapshots.png
    - comets_br_particles_kinetics_video.gif
    - comets_br_particles_kinetics_viz.png
    - comets_br_particles_kinetics_schema.json
    - comets_br_particles_kinetics_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
