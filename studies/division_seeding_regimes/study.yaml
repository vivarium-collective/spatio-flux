schema_version: 3
name: division_seeding_regimes
investigation: spatio-flux-test-suite
title: Division-threshold population regimes
status: complete
phase: Evaluate
confidence: Accepted
claim: Raising the division mass threshold monotonically shrinks the final particle population in the full COMETS composite — a division-controlled population-size phase relationship.
purpose:
  question: How does the particle population size depend on the division mass threshold in the coupled field+agent COMETS composite?
  mechanism: 'Parameter-sweep phase-diagram study (discovery engine): a real composite swept over one axis, reduced to a regime metric.'
  expected_outcome: The metric varies monotonically across the swept axis, revealing the regime relationship.
question: How does the particle population size depend on the division mass threshold in the coupled field+agent COMETS composite?
conditions:
  sweep:
    composite: spatio_flux.composites.comets.comets_br_particles_dfba
    fixed:
      n_particles: 1
      add_rate: 0.3
    axis:
      division_mass_threshold:
      - 2
      - 3
      - 5
      - 8
    metric:
      name: final_n_particles
      kind: n_particles
    steps: 40
    seeds:
    - 0
    - 1
    - 2
  model_settings: []
  baseline:
    name: representative
    composite: spatio_flux.composites.comets.comets_br_particles_dfba
    params:
      n_particles: 1
      add_rate: 0.3
      division_mass_threshold: 3
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_sweep.py
  args:
  - division_seeding_regimes
  - '40'
  label: sweep division_seeding_regimes
  default: true
visualizations:
- name: division_seeding_regimes phase diagram
  address: image:charts/division_seeding_regimes_phase.png
  chart: image
behavior_tests:
- name: DIVISION-SEEDING-POPULATION-DECREASES
  classification: primary
  description: final particle population decreases monotonically as the division mass threshold rises.
  measure:
    kind: observable_monotone
    slug: division_seeding_regimes
    observable: final_n_particles
    run_id: division_seeding_regimes-reproduce
    direction: decreasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
runs:
- name: division_seeding_regimes-reproduce
  run_id: division_seeding_regimes-reproduce
  kind: sweep
  status: completed
  canonical: true
  composite: spatio_flux.composites.comets.comets_br_particles_dfba
  emitter:
    kind: xarray
    store: studies/division_seeding_regimes/runs.division_seeding_regimes-reproduce.zarr
  store_path: studies/division_seeding_regimes/runs.division_seeding_regimes-reproduce.zarr
  outcomes:
    DIVISION-SEEDING-POPULATION-DECREASES:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/decreasing
      detail: decreasing; steps [-19.33,-3.333]; start 69 end 38.33; tol 0.01
  computed_outcomes:
    DIVISION-SEEDING-POPULATION-DECREASES:
      result: PASS
      measured_value: 38.333333333333336
      evaluated_by: code
      operator: observable_monotone/decreasing
      detail: decreasing; steps [-19.33,-3.333]; net -30.67; start 69 end 38.33; tol 0.01
      reconcile: agree
findings:
- id: F1
  kind: biological
  status: confirms
  statement: 'Averaged over 3 seeds, the final population falls monotonically across division thresholds 2->8 (69->38): a higher mass bar for division yields fewer, larger cells. Single seeds are noisy (the regime only emerges on the seed average), so this is a multiseed-robust population phase relationship.'
  evidence:
    from_test: DIVISION-SEEDING-POPULATION-DECREASES
  provenance:
    run_ids:
    - division_seeding_regimes-reproduce
  tier: interpretation
  mechanism_origin: emergent
discovery_implications:
  resolved:
  - Final population size is set monotonically by the division mass threshold.
  remaining:
  - The joint threshold x seeding-rate (add_rate) regime map is only sampled on one axis.
  followup_study_proposals:
  - id: division-seeding-2d-phase
    motivation: A 2D sweep over division_mass_threshold x add_rate would map the full population phase diagram, not just the threshold axis.
    candidate: comets_br_particles_dfba 2D sweep
gate_status: passed
falsifiability: If the seed-averaged final population did not fall as the division mass threshold rose, the division-controlled-population claim would be false.
limitations:
- One sweep axis (threshold) at fixed seeding rate; 3 seeds; a single horizon.
- Single-seed runs are noisy — the regime is only robust on the seed average.
alternative_hypotheses:
- hypothesis: The population trend is driven by the seeding rate, not the division threshold.
  excluded_by: add_rate is held fixed across the sweep; only division_mass_threshold varies.
