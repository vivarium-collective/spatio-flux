schema_version: 3
name: diffusion_process
created: '2026-07-26'
status: planned
phase: Design
baseline:
- name: baseline
  composite: spatio_flux.composites.spatial.diffusion_process
  params: {}
purpose:
  question: 'Field transport primitive: finite-volume diffusion/advection on a 2D
    lattice. Use to validate boundary conditions, stability, and transport timescales.'
  mechanism: Runs the spatio_flux.composites.spatial.diffusion_process composite (standalone
    process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - diffusion_process
  - '60'
  label: reproduce diffusion_process figures
  default: true
visualizations:
- name: diffusion_process_video.gif
  address: image:charts/diffusion_process_video.gif
  chart: image
- name: diffusion_process_viz.png
  address: image:charts/diffusion_process_viz.png
  chart: image
- name: diffusion_process_schema.json
  address: image:charts/diffusion_process_schema.json
  chart: image
- name: diffusion_process_state.json
  address: image:charts/diffusion_process_state.json
  chart: image
behavior_tests:
- name: DIFFUSION_PROCESS-REPRODUCES-REPORT
  classification: regression
  description: All test-suite artifacts for this scenario are reproduced and match
    the out0 reference within tolerance.
  measure:
    kind: artifacts_present
    expected:
    - diffusion_process_video.gif
    - diffusion_process_viz.png
    - diffusion_process_schema.json
    - diffusion_process_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.02
  requires_simulation: reproduce
