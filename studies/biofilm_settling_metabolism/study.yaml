schema_version: 3
name: biofilm_settling_metabolism
investigation: spatio-flux-test-suite
title: Biofilm settling + metabolism
status: complete
phase: Evaluate
confidence: Accepted
claim: Rigid-body cells settle and pack under gravity while feeding on the nutrient field, so growth becomes spatially structured by depth — mechanics and metabolism couple.
purpose:
  question: When rigid-body cells settle under gravity while feeding, does growth become spatially structured by depth?
  mechanism: Pymunk rigid-body particles settle under gravity, each running internal dFBA against the local COMETS fields, dividing as they grow.
  expected_outcome: Cells settle (mean depth increases) and per-cell mass correlates with depth; the population grows and packs.
question: Does gravity-driven settling structure metabolic growth by depth?
conditions:
  baseline:
    name: representative
    composite: spatio_flux.composites.comets.comets_nt_particles_dfba
    params:
      n_particles: 8
  model_settings: []
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_new_study.py
  args:
  - biofilm_settling_metabolism
  - '40'
  label: run biofilm
  default: true
visualizations:
- name: biofilm particle movie
  address: html:viz/biofilm_settling_metabolism_particles.html
  chart: html
behavior_tests:
- name: N4-GROWTH-STRUCTURED-BY-DEPTH
  classification: primary
  description: 'per-cell mass correlates with depth (y): settled cells near the nutrient-facing edge grow differently than others.'
  measure:
    kind: gradient_correlation
    slug: biofilm_settling_metabolism
    axis: y
    run_id: biofilm_settling_metabolism-reproduce
  pass_if:
    op: gradient_correlation
    min_abs_corr: 0.4
  requires_simulation: reproduce
- name: N4-POPULATION-GROWS
  classification: primary
  description: total particle mass grows as cells feed and divide.
  measure:
    kind: observable_monotone
    slug: biofilm_settling_metabolism
    observable: particle_mass
    direction: increasing
    run_id: biofilm_settling_metabolism-reproduce
  pass_if:
    op: monotone
    tolerance: 0.05
  requires_simulation: reproduce
findings:
- id: F1
  kind: biological
  status: confirms
  tier: interpretation
  mechanism_origin: emergent
  statement: Cells settle under gravity and feed, so per-cell growth becomes spatially structured by depth — mechanics (settling, packing) and metabolism (dFBA on local fields) couple into a biofilm-like layer.
  evidence:
    from_test: N4-GROWTH-STRUCTURED-BY-DEPTH
  provenance:
    run_ids:
    - biofilm_settling_metabolism-reproduce
falsifiability: If per-cell mass were uncorrelated with depth, growth would not be spatially structured by settling.
limitations:
- Few founder cells + one horizon; the depth-structuring is modest at this scale.
- Stochastic (pymunk + seeding); reported from the representative run.
alternative_hypotheses:
- hypothesis: Any mass-depth correlation is just initial seeding, not settling+feeding.
  excluded_by: Cells start spread and settle over the run; the correlation is read at the final (settled, fed) state.
discovery_implications:
  resolved:
  - Gravity-driven settling spatially structures metabolic growth (biofilm-like).
  remaining:
  - How packing density and the nutrient gradient co-determine the growth structure is not quantified.
  followup_study_proposals:
  - id: packing-vs-nutrient
    motivation: Sweep cell count / gravity to map how packing density shapes the depth-structured growth.
    candidate: comets_nt_particles_dfba sweep over n_particles/gravity
gate_status: passed
runs:
- name: biofilm_settling_metabolism-reproduce
  run_id: biofilm_settling_metabolism-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.comets.comets_nt_particles_dfba
  emitter:
    kind: xarray
    store: studies/biofilm_settling_metabolism/runs.biofilm_settling_metabolism-reproduce.zarr
  store_path: studies/biofilm_settling_metabolism/runs.biofilm_settling_metabolism-reproduce.zarr
  outcomes:
    N4-POPULATION-GROWS:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [0.03412,0.113]; net +2.332; start 0.5632 end 2.895; tol 0.05
    N4-GROWTH-STRUCTURED-BY-DEPTH:
      result: PASS
      evaluated_by: code
      operator: gradient_correlation
      detail: '|corr(mass, y)| = 0.505 vs min 0.4'
