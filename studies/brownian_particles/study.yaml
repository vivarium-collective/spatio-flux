schema_version: 3
name: brownian_particles
created: '2026-07-26'
status: complete
phase: Evaluate
design_status: complete
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
purpose:
  question: 'Particle-only baseline: Brownian motion of agents with mass in continuous space (no fields, no metabolism). Checks integrator + particle state schema.'
  mechanism: Runs the spatio_flux.composites.particles.brownian_particles composite (standalone process).
  expected_outcome: Reproduces the current test-suite report artifacts for this scenario.
pipeline_gate:
  prerequisites: []
  enables: []
  proceed_condition: Composition ordering only; this study runs independently.
limitations:
- Faithful reproduction of an existing scenario; no new biology.
- Graph edges document composition, they do not gate execution.
canonical_runs:
- name: reproduce
  script: spatio_flux/runners/run_study.py
  args:
  - brownian_particles
  - '200'
  label: reproduce brownian_particles figures
  default: true
visualizations:
- name: brownian_particles.svg
  address: image:visualizations/brownian_particles.svg
  chart: image
- name: brownian_particles_snapshots.png
  address: image:charts/brownian_particles_snapshots.png
  chart: image
- name: brownian_particles_particles_traces.png
  address: image:charts/brownian_particles_particles_traces.png
  chart: image
- name: brownian_particles_mass.png
  address: image:charts/brownian_particles_mass.png
  chart: image
behavior_tests:
- name: BROWNIAN_PARTICLES-REPRODUCES-REPORT
  classification: regression
  description: All 7 expected artifacts are produced in charts/, and the composite's structural schema (brownian_particles_schema.json) matches the committed reference in studies/<slug>/reference/. State/figures embed RNG or non-deterministic renders, so they are existence-checked.
  measure:
    kind: artifacts_present
    expected:
    - brownian_particles_video.gif
    - brownian_particles_mass.png
    - brownian_particles_snapshots.png
    - brownian_particles_particles_traces.png
    - brownian_particles_viz.png
    - brownian_particles_schema.json
    - brownian_particles_state.json
  pass_if:
    op: all_exist_and_match
    tolerance: 0.0
  requires_simulation: reproduce
- name: BROWNIAN-PARTICLES-DIFFUSIVE-MSD
  classification: primary
  description: mean-squared displacement grows ~linearly in time (diffusive).
  measure:
    kind: observable_msd_linear
    slug: brownian_particles
    observable: particle_x
    expected:
    - 0.1
    - 3.0
  pass_if:
    op: msd_linear
    min_r2: 0.3
  requires_simulation: reproduce
- name: BROWNIAN-PARTICLES-N_PARTICLES-GROWS
  classification: primary
  description: n_particles increases monotonically over the run.
  measure:
    kind: observable_monotone
    slug: brownian_particles
    observable: n_particles
    direction: increasing
  pass_if:
    op: monotone
    tolerance: 0.01
  requires_simulation: reproduce
runs:
- name: brownian_particles-reproduce
  run_id: brownian_particles-reproduce
  kind: simulation
  status: completed
  canonical: true
  composite: spatio_flux.composites.particles.brownian_particles
  emitter:
    kind: xarray
    store: studies/brownian_particles/runs.brownian_particles-reproduce.zarr
  store_path: studies/brownian_particles/runs.brownian_particles-reproduce.zarr
  timestamp: '2026-09-20T15:24:04Z'
  result: PASS
  outcomes:
    BROWNIAN_PARTICLES-REPRODUCES-REPORT:
      result: PASS
      evaluated_by: code
      detail: 7/7 artifacts present; brownian_particles_schema.json matches reference (structural, tol=0.0)
    BROWNIAN-PARTICLES-N_PARTICLES-GROWS:
      result: PASS
      evaluated_by: code
      operator: observable_monotone/increasing
      detail: increasing; steps [0,1]; start 1 end 7; tol 0.01
    BROWNIAN-PARTICLES-DIFFUSIVE-MSD:
      result: PASS
      evaluated_by: code
      operator: observable_msd_linear
      detail: MSD slope 0.8474 (band [0.1, 3.0]); R² 0.846 (min 0.3)
findings:
- id: F1
  kind: computational
  status: passed
  statement: spatio_flux reproduces the brownian_particles test-suite artifacts and the composite's structural schema matches its committed reference.
  evidence:
    from_test: BROWNIAN_PARTICLES-REPRODUCES-REPORT
  provenance:
    run_ids:
    - brownian_particles-reproduce
- id: F2
  kind: biological
  status: confirms
  statement: The agents' mean-squared displacement grows with a positive, near-linear slope (diffusive scaling) and the population count is non-decreasing — a quantitative Brownian-motion signature, not just an artifact check.
  evidence:
    from_test: BROWNIAN-PARTICLES-DIFFUSIVE-MSD
  provenance:
    run_ids:
    - brownian_particles-reproduce
conclusion_logic:
  if_primary_tests_pass:
    implementation_status: The brownian_particles scenario is faithfully reproduced by the investigation's post-run analysis flush.
    biological_validation: Validates that the composition reproduces the reference test-suite artifacts; it does not add new biological claims beyond the original scenario.
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
    - Compare charts/<slug>_schema.json against studies/<slug>/reference/.
    - Check the composite build and the FLUSH_SPEC config for this slug.
    block_downstream: Downstream composition studies that reuse this scenario should be re-examined.
conditions:
  baseline:
    name: baseline
    composite: spatio_flux.composites.particles.brownian_particles
    params: {}
  model_settings: []
question: 'Particle-only baseline: Brownian motion of agents with mass in continuous space (no fields, no metabolism). Checks integrator + particle state schema.'
